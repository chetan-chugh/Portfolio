    <!--
      FONT STACK
      ───────────────────────────────────────────────────────────────
      Inter (300–800)  — single-family hierarchy via weight alone.
        Clean, geometric, zero rendering issues on dark backgrounds.
        Used by Vercel, Linear, Clerk — the standard for dev UIs.
        Weight map:
          300 → body text descriptions (breathable on dark bg)
          400 → nav, card text, secondary labels
          500 → buttons, sub-headings, about cards
          600 → section titles (H3, H4)
          700 → section headings (H2)
          800 → hero name, display text (H1)

      Fira Code (400–500) — monospace for labels, badges, stats.
        Better ligatures than JetBrains Mono at 10–12px.
        Signals developer credibility without being heavy.
      ───────────────────────────────────────────────────────────────
    -->
